name: Windows build and tests
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore ScrollPDF.sln
      - run: dotnet build ScrollPDF.sln --configuration Release --no-restore
      - run: dotnet test ScrollPDF.sln --configuration Release --no-build